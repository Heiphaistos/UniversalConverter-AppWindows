[package]
name = "universalconverter"
version = "1.13.0"
description = "Universal File Converter"
authors = ["Momo"]
edition = "2021"

[lib]
name = "universalconverter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"

# Images raster (PNG, JPG, WEBP, BMP, GIF, TIFF, ICO, TGA, PNM, HDR, AVIF, QOI, EXR, DDS, FF)
image = { version = "0.25", features = [
    "png", "jpeg", "webp", "bmp", "gif", "tiff", "ico", "tga",
    "pnm", "hdr", "avif", "qoi", "exr", "dds", "ff"
] }

# PDF
lopdf    = "0.42"
printpdf = "0.12"

# SVG → raster (pure Rust)
resvg = "0.44"

# Markdown → HTML / TXT
pulldown-cmark = "0.11"

# Office : lecture ZIP (DOCX, PPTX, XLSX sont des archives ZIP)
zip = "2"

# Office : parsing XML interne (DOCX, PPTX)
quick-xml = "0.41"

# Office : lecture Excel (XLS, XLSX, ODS)
calamine = "0.36"

# Office : écriture XLSX
rust_xlsxwriter = "0.93"

# CSV
csv = "1"

# Data structurée (YAML, TOML)
serde_yaml = "0.9"
toml = "0.8"

# Archives (TAR, GZ, 7Z — ZIP déjà présent)
tar = "0.4"
flate2 = "1"
sevenz-rust2 = "0.22"

# Audio : décodage (MP3, AAC/M4A, OGG, FLAC, WAV) + encodage WAV/FLAC
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "vorbis", "flac"] }
hound = "3.5"
flacenc = "0.4"

# Documents : EPUB lecture/écriture, DOCX écriture, HTML → Markdown
epub = "2"
epub-builder = "0.7"
docx-rs = "0.4"
htmd = "0.1"
