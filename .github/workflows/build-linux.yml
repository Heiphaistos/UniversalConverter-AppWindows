name: Build Linux

# Vérifie que l'application compile sous Linux et produit les paquets .deb,
# .rpm et .AppImage. Déclenchable à la main ; se lance aussi sur un tag v*.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # Dépendances système de Tauri v2. webkit2gtk-4.1 est la version attendue
      # par Tauri 2 (la 4.0 est celle de Tauri 1) ; patchelf est requis par le
      # bundler AppImage.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        working-directory: .
        run: npm ci

      - name: Build
        working-directory: .
        run: npx --yes @tauri-apps/cli@latest build

      - name: List produced bundles
        if: always()
        run: find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linux-bundles
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
